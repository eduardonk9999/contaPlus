server:
  port: 8081

spring:
  application:
    name: contaPlus

  datasource:
    url: jdbc:postgresql://localhost:5432/contaplus
    username: contaplus
    password: contaplus

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

jwt:
  secret: ${JWT_SECRET:chave-secreta-contaplus-desenvolvimento-min-256-bits-ok}
  expiration: 86400000

rate-limit:
  enabled: true
  requests-per-minute: 60
  auth-requests-per-minute: 10
  burst-capacity: 20

cache:
  enabled: ${CACHE_ENABLED:true}

spring.data.redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}
  timeout: 2000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  show-actuator: false

logging:
  level:
    root: INFO
    com.contaplus: DEBUG