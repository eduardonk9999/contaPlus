server:
  port: 8081

spring:
  application:
    name: contaPlus

  datasource:
    url: jdbc:postgresql://localhost:5432/contaplus
    username: contaplus
    password: contaplus

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

jwt:
  secret: ${JWT_SECRET:chave-secreta-contaplus-desenvolvimento-min-256-bits-ok}
  expiration: 86400000

logging:
  level:
    org.hibernate.SQL: debug